[project]
name = "graphrag-backend"
version = "0.1.0"
description = "GraphRAG 多模态知识问答系统后端服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "sse-starlette>=2.0",
    "pydantic>=2",
    "httpx>=0.27",
    "pandas>=3.0.3",
    # graphrag_pipeline 通过 sys.path 直接 import（见 app/agent_runner/cache.py），
    # 它的运行时依赖必须装进 backend 共享 venv，否则 build_agent 失败、
    # 缓存里拿到 None agent → 'NoneType' object has no attribute 'astream'。
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
]

[tool.uv]
package = false
